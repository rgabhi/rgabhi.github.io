<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 425" role="img" aria-labelledby="title"><title id="title">Per-channel batch normalization over examples and spatial positions</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#315f91"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#24344b}.title{font-size:22px;font-weight:600}.label{font-size:17px}.small{font-size:14px;fill:#526172}.value{font-size:22px}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="40" class="title">CNN batch normalization collects statistics per channel</text><text x="50" y="89" class="small">Example 1</text><rect x="50" y="130" width="52" height="130" rx="7" fill="#f4e0dc" stroke="#cbd9e9"/><text x="63" y="205" class="small">C1</text><rect x="108" y="130" width="52" height="130" rx="7" fill="#deebf7" stroke="#cbd9e9"/><text x="121" y="205" class="small">C2</text><rect x="166" y="130" width="52" height="130" rx="7" fill="#e0eddc" stroke="#cbd9e9"/><text x="179" y="205" class="small">C3</text><text x="270" y="89" class="small">Example 2</text><rect x="270" y="130" width="52" height="130" rx="7" fill="#f4e0dc" stroke="#cbd9e9"/><text x="283" y="205" class="small">C1</text><rect x="328" y="130" width="52" height="130" rx="7" fill="#deebf7" stroke="#cbd9e9"/><text x="341" y="205" class="small">C2</text><rect x="386" y="130" width="52" height="130" rx="7" fill="#e0eddc" stroke="#cbd9e9"/><text x="399" y="205" class="small">C3</text><text x="490" y="89" class="small">Example 3</text><rect x="490" y="130" width="52" height="130" rx="7" fill="#f4e0dc" stroke="#cbd9e9"/><text x="503" y="205" class="small">C1</text><rect x="548" y="130" width="52" height="130" rx="7" fill="#deebf7" stroke="#cbd9e9"/><text x="561" y="205" class="small">C2</text><rect x="606" y="130" width="52" height="130" rx="7" fill="#e0eddc" stroke="#cbd9e9"/><text x="619" y="205" class="small">C3</text><path d="M710,196 L775,196" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="790" y="103" width="170" height="210" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="810" y="143" class="label">Per channel:</text><text x="810" y="180" class="label">mean</text><text x="810" y="212" class="label">variance</text><text x="810" y="244" class="label">γ and β</text><text x="45" y="355" class="small">For each channel, pool N × H × W scalar values for the statistics. Do not mix different channels.</text><text x="45" y="390" class="small">Learned parameters: two per channel. Running means and variances are stored state, not gradient parameters.</text></svg>