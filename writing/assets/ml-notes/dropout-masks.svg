<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" role="img" aria-labelledby="title"><title id="title">Several dropout masks applied to the same four-unit representation</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#315f91"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#24344b}.title{font-size:22px;font-weight:600}.label{font-size:17px}.small{font-size:14px;fill:#526172}.value{font-size:22px}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="40" class="title">Dropout changes the active paths while retaining shared parameters</text><text x="75" y="86" class="label">Full representation</text><circle cx="95" cy="130" r="17" fill="#d6e5f5" stroke="#315f91"/><path d="M113,130 L255,208" stroke="#7390ab" fill="none"/><circle cx="95" cy="181" r="17" fill="#d6e5f5" stroke="#315f91"/><path d="M113,181 L255,208" stroke="#7390ab" fill="none"/><circle cx="95" cy="232" r="17" fill="#d6e5f5" stroke="#315f91"/><path d="M113,232 L255,208" stroke="#7390ab" fill="none"/><circle cx="95" cy="283" r="17" fill="#d6e5f5" stroke="#315f91"/><path d="M113,283 L255,208" stroke="#7390ab" fill="none"/><circle cx="272" cy="208" r="23" fill="#edf3fa" stroke="#315f91"/><text x="400" y="86" class="label">One training mask</text><circle cx="420" cy="130" r="17" fill="#d6e5f5" stroke="#315f91"/><path d="M438,130 L580,208" stroke="#7390ab" fill="none"/><circle cx="420" cy="181" r="17" fill="#f4f4f4" stroke="#b6b6b6"/><path d="M409,170 l22,22 M409,192 l22,-22" stroke="#9ca3af" stroke-width="2"/><circle cx="420" cy="232" r="17" fill="#d6e5f5" stroke="#315f91"/><path d="M438,232 L580,208" stroke="#7390ab" fill="none"/><circle cx="420" cy="283" r="17" fill="#f4f4f4" stroke="#b6b6b6"/><path d="M409,272 l22,22 M409,294 l22,-22" stroke="#9ca3af" stroke-width="2"/><circle cx="597" cy="208" r="23" fill="#edf3fa" stroke="#315f91"/><text x="725" y="86" class="label">Another training mask</text><circle cx="745" cy="130" r="17" fill="#f4f4f4" stroke="#b6b6b6"/><path d="M734,119 l22,22 M734,141 l22,-22" stroke="#9ca3af" stroke-width="2"/><circle cx="745" cy="181" r="17" fill="#d6e5f5" stroke="#315f91"/><path d="M763,181 L905,208" stroke="#7390ab" fill="none"/><circle cx="745" cy="232" r="17" fill="#d6e5f5" stroke="#315f91"/><path d="M763,232 L905,208" stroke="#7390ab" fill="none"/><circle cx="745" cy="283" r="17" fill="#f4f4f4" stroke="#b6b6b6"/><path d="M734,272 l22,22 M734,294 l22,-22" stroke="#9ca3af" stroke-width="2"/><circle cx="922" cy="208" r="23" fill="#edf3fa" stroke="#315f91"/><text x="45" y="362" class="small">Every sampled subnetwork reuses the underlying weights; inactive activations receive zero gradient through the mask.</text></svg>