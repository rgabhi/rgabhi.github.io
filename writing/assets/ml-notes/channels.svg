<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title"><title id="title">Channel-wise multiplication and summation for a single filter</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#315f91"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#24344b}.title{font-size:22px;font-weight:600}.label{font-size:17px}.small{font-size:14px;fill:#526172}.line{stroke:#315f91;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text x="35" y="40" class="title" >One filter sees every input channel; one filter produces one output map</text><text x="45" y="88" class="small" >Red</text><rect x="45" y="105" width="88" height="116" rx="7" fill="#f7e1de" stroke="#cbd9e9"/><text x="65" y="171" class="label" >X1</text><rect x="45" y="250" width="88" height="65" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="64" y="290" class="label" >W1</text><path d="M89,225 V245" class="line"/><text x="165" y="88" class="small" >Green</text><rect x="165" y="105" width="88" height="116" rx="7" fill="#e2efdf" stroke="#cbd9e9"/><text x="185" y="171" class="label" >X2</text><rect x="165" y="250" width="88" height="65" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="184" y="290" class="label" >W2</text><path d="M209,225 V245" class="line"/><text x="285" y="88" class="small" >Blue</text><rect x="285" y="105" width="88" height="116" rx="7" fill="#dce8f7" stroke="#cbd9e9"/><text x="305" y="171" class="label" >X3</text><rect x="285" y="250" width="88" height="65" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="304" y="290" class="label" >W3</text><path d="M329,225 V245" class="line"/><text x="52" y="350" class="small" >Three channel-wise dot products</text><path d="M400,210 H480" class="line"/><rect x="495" y="140" width="130" height="130" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="519" y="185" class="label" >Sum all</text><text x="519" y="215" class="label" >channels</text><text x="523" y="245" class="label" >+ bias</text><path d="M630,210 H700" class="line"/><rect x="725" y="120" width="210" height="180" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="750" y="166" class="label" >One response</text><text x="750" y="195" class="label" >at each location</text><text x="750" y="260" class="small" >→ one feature map</text></svg>