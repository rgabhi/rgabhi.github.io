<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title"><title id="title">A shared kernel scatters upstream contributions into a three by three input gradient</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#315f91"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#24344b}.title{font-size:22px;font-weight:600}.label{font-size:17px}.small{font-size:14px;fill:#526172}.value{font-size:22px}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="40" class="title">Input gradients add when output windows overlap</text><text x="50" y="85" class="label">Upstream δ</text><rect x="50" y="110" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="72" y="150" class="value">1</text><rect x="115" y="110" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="137" y="150" class="value">2</text><rect x="50" y="175" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="72" y="215" class="value">3</text><rect x="115" y="175" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="137" y="215" class="value">4</text><text x="300" y="85" class="label">Kernel K</text><rect x="300" y="110" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="322" y="150" class="value">1</text><rect x="365" y="110" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="387" y="150" class="value">0</text><rect x="300" y="175" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="322" y="215" class="value">0</text><rect x="365" y="175" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="387" y="215" class="value">-1</text><text x="650" y="70" class="label">Input gradient dL/dX</text><rect x="650" y="95" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="672" y="135" class="value">1</text><rect x="715" y="95" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="737" y="135" class="value">2</text><rect x="780" y="95" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="802" y="135" class="value">0</text><rect x="650" y="160" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="672" y="200" class="value">3</text><rect x="715" y="160" width="62" height="62" rx="7" fill="#f4e8d7" stroke="#cbd9e9"/><text x="737" y="200" class="value">3</text><rect x="780" y="160" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="802" y="200" class="value">-2</text><rect x="650" y="225" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="672" y="265" class="value">0</text><rect x="715" y="225" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="737" y="265" class="value">-3</text><rect x="780" y="225" width="62" height="62" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="802" y="265" class="value">-4</text><path d="M465,175 L615,175" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="470" y="150" class="small">scatter &amp; add</text><text x="50" y="315" class="label">Two nonzero central contributions: 1 × (−1) + 4 × 1 = 3.</text><text x="50" y="354" class="small">This diagram uses the linear layer’s pre-activation gradient. No extra ReLU gate is applied here.</text></svg>