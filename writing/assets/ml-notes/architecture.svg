<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" role="img" aria-labelledby="title"><title id="title">CNN architecture with example tensor shapes</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#315f91"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#24344b}.title{font-size:22px;font-weight:600}.label{font-size:17px}.small{font-size:14px;fill:#526172}.line{stroke:#315f91;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text x="40" y="42" class="title" >A CNN changes the representation, one local computation at a time</text><rect x="35" y="96" width="165" height="150" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="50" y="129" class="label" >Image</text><text x="50" y="218" class="small" >32 × 32 × 3</text><path d="M203,170 H225" class="line"/><rect x="67" y="147" width="63" height="42" fill="#d5e4f1" stroke="#7390ab"/><rect x="74" y="141" width="63" height="42" fill="#e6edf6" stroke="#7390ab"/><rect x="81" y="135" width="63" height="42" fill="#f2e7d9" stroke="#7390ab"/><rect x="230" y="96" width="165" height="150" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="245" y="129" class="label" >Conv + ReLU</text><text x="245" y="218" class="small" >28 × 28 × 6</text><path d="M398,170 H420" class="line"/><rect x="262" y="147" width="63" height="42" fill="#d5e4f1" stroke="#7390ab"/><rect x="269" y="141" width="63" height="42" fill="#e6edf6" stroke="#7390ab"/><rect x="276" y="135" width="63" height="42" fill="#f2e7d9" stroke="#7390ab"/><rect x="283" y="129" width="63" height="42" fill="#d5e4f1" stroke="#7390ab"/><rect x="425" y="96" width="165" height="150" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="440" y="129" class="label" >Max pool</text><text x="440" y="218" class="small" >14 × 14 × 6</text><path d="M593,170 H615" class="line"/><rect x="457" y="147" width="63" height="42" fill="#d5e4f1" stroke="#7390ab"/><rect x="464" y="141" width="63" height="42" fill="#e6edf6" stroke="#7390ab"/><rect x="471" y="135" width="63" height="42" fill="#f2e7d9" stroke="#7390ab"/><rect x="478" y="129" width="63" height="42" fill="#d5e4f1" stroke="#7390ab"/><rect x="620" y="96" width="165" height="150" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="635" y="129" class="label" >Conv + ReLU</text><text x="635" y="218" class="small" >10 × 10 × 10</text><path d="M788,170 H810" class="line"/><rect x="652" y="147" width="63" height="42" fill="#d5e4f1" stroke="#7390ab"/><rect x="659" y="141" width="63" height="42" fill="#e6edf6" stroke="#7390ab"/><rect x="666" y="135" width="63" height="42" fill="#f2e7d9" stroke="#7390ab"/><rect x="673" y="129" width="63" height="42" fill="#d5e4f1" stroke="#7390ab"/><rect x="815" y="96" width="165" height="150" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="830" y="129" class="label" >Readout</text><text x="830" y="218" class="small" >class scores</text><rect x="847" y="147" width="63" height="42" fill="#d5e4f1" stroke="#7390ab"/><text x="40" y="292" class="label" >Convolution learns filters. ReLU adds nonlinearity. Pooling reduces spatial resolution.</text><text x="40" y="326" class="small" >Shapes shown: 5 × 5 valid convolutions, stride 1; 2 × 2 pooling, stride 2.</text></svg>