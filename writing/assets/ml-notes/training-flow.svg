<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 355" role="img" aria-labelledby="title"><title id="title">The forward and backward computations in a neural network</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#315f91"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#24344b}.title{font-size:22px;font-weight:600}.label{font-size:17px}.small{font-size:14px;fill:#526172}.value{font-size:22px}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="40" class="title">Forward: compute a prediction. Backward: trace how the loss changes.</text><rect x="30" y="110" width="160" height="120" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="45" y="150" class="label">Input X</text><text x="45" y="187" class="small">data</text><path d="M195,168 L220,168" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="225" y="110" width="160" height="120" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="240" y="150" class="label">Conv Z</text><text x="240" y="187" class="small">shared W, b</text><path d="M390,168 L415,168" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="420" y="110" width="160" height="120" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="435" y="150" class="label">ReLU A</text><text x="435" y="187" class="small">local gate</text><path d="M585,168 L610,168" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="615" y="110" width="160" height="120" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="630" y="150" class="label">Later layers</text><text x="630" y="187" class="small">prediction</text><path d="M780,168 L805,168" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="810" y="110" width="160" height="120" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="825" y="150" class="label">Loss L</text><text x="825" y="187" class="small">one number</text><text x="40" y="87" class="small">FORWARD →</text><text x="40" y="286" class="small">← BACKWARD</text><path d="M310,270 L160,270" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M505,270 L355,270" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M700,270 L550,270" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M895,270 L745,270" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="40" y="325" class="small">Cache the forward quantities. Accumulate gradients along every path. Update parameters after backprop.</text></svg>