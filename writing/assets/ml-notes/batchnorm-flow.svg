<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" role="img" aria-labelledby="title"><title id="title">The steps of batch normalization in training and inference</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#315f91"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#24344b}.title{font-size:22px;font-weight:600}.label{font-size:17px}.small{font-size:14px;fill:#526172}.value{font-size:22px}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="40" class="title">Batch normalization: estimate, normalize, then learn a scale and shift</text><rect x="35" y="100" width="220" height="140" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="52" y="143" class="label">Batch values</text><text x="52" y="190" class="small">x₁, x₂, …, xₘ</text><path d="M257,171 L277,171" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="280" y="100" width="220" height="140" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="297" y="143" class="label">Mean &amp; variance</text><text x="297" y="190" class="small">μB and vB</text><path d="M502,171 L522,171" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="525" y="100" width="220" height="140" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="542" y="143" class="label">Normalize</text><text x="542" y="190" class="small">(x − μB) / √(vB + ε)</text><path d="M747,171 L767,171" stroke="#315f91" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="770" y="100" width="220" height="140" rx="7" fill="#edf3fa" stroke="#cbd9e9"/><text x="787" y="143" class="label">Scale &amp; shift</text><text x="787" y="190" class="small">γ × normalized + β</text><text x="40" y="284" class="label">Training: current-batch statistics participate in the computation and its derivatives.</text><text x="40" y="323" class="label">Inference: use stored running statistics; γ and β are still applied.</text><text x="40" y="363" class="small">One feature/channel at a time. Normalization changes values, not tensor shape.</text></svg>